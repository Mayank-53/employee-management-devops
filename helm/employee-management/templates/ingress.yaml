apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: employee-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: nginx

  rules:
  - host: {{ .Values.ingress.host }}

    http:

      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: employee-frontend-service

            port:
              number: 80

      - path: /api

        pathType: Prefix

        backend:
          service:
            name: employee-backend-service

            port:
              number: 8000
